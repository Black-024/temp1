name: iOS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas del núcleo
        run: swift test 2>&1 | tee test.log
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar (sin firmar)
        run: |
          set -o pipefail
          xcodebuild -project TallyMonitor.xcodeproj -scheme TallyMonitor -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log
      - name: Armar .ipa sin firmar
        run: |
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/TallyMonitor.app ipa/Payload/
          (cd ipa && zip -qr ../TallyMonitor-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: TallyMonitor-ipa
          path: TallyMonitor-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            test.log
            build.log
